services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ejbca
      POSTGRES_USER: ejbca
      POSTGRES_PASSWORD: ejbca
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejbca"]
      interval: 10s
      timeout: 5s
      retries: 12

  ejbca:
    image: ghcr.io/thpham/ejbca-ce:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_JDBC_URL:    "jdbc:postgresql://postgres:5432/ejbca"
      DATABASE_USER:        ejbca
      DATABASE_PASSWORD:    ejbca
      TLS_SETUP_ENABLED:    "simple"
      EJBCA_ADMIN_ALLOW_ANY_IP: "true"
      SOFTHSM_TOKEN_LABEL:  "TestToken"
      SOFTHSM_TOKEN_PIN:    "1234"
      SOFTHSM_TOKEN_SO_PIN: "12345678"
    ports:
      - "8443:8443"
    volumes:
      - softhsm-tokens:/var/lib/softhsmv3/tokens
      - ejbca-p12:/opt/keyfactor/ejbca/p12
      - demo-certs:/demo/certs
      - ./init-demo.sh:/demo/init-demo.sh:ro
      - ./init-demo-phase2.sh:/demo/init-demo-phase2.sh:ro
      - ./init-demo-phase3.sh:/demo/init-demo-phase3.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8443/ejbca/publicweb/healthcheck/ejbcahealth"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  nginx:
    build:
      context: ..
      dockerfile: demo/Dockerfile.nginx
    depends_on:
      ejbca:
        condition: service_healthy
    ports:
      - "4443:443"
      - "4444:4444"
    volumes:
      - demo-certs:/etc/nginx/certs
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  # ─── MTC Bridge (polls EJBCA REST API → Merkle tree) ─────────────────────
  mtc-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mtcbridge
      POSTGRES_USER: mtcbridge
      POSTGRES_PASSWORD: mtcbridge
    volumes:
      - mtc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtcbridge"]
      interval: 10s
      timeout: 5s
      retries: 12

  mtc-bridge:
    image: mtc-bridge-ejbca:latest
    depends_on:
      mtc-postgres:
        condition: service_healthy
      ejbca:
        condition: service_healthy
    environment:
      EJBCA_BASE_URL: "https://ejbca:8443/ejbca/ejbca-rest-api"
      EJBCA_CLIENT_CERT: "/etc/mtc-bridge/certs/admin.crt"
      EJBCA_CLIENT_CERT_PASSWORD: "ejbca"
      EJBCA_CA_NAME: "Hybrid-RootCA"
      EJBCA_INSECURE_SKIP_VERIFY: "true"
      MTC_STATE_DB_HOST: mtc-postgres
    volumes:
      - ./mtc-bridge-config.yaml:/etc/mtc-bridge/config.yaml:ro
      - mtc-keys:/etc/mtc-bridge/keys
      - demo-certs:/etc/mtc-bridge/certs:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─── MTC TLS Server (staples Merkle proof into TLS handshake) ───────────
  mtc-tls-server:
    image: mtc-bridge-ejbca:latest
    entrypoint: ["mtc-tls-server"]
    command:
      - "-cert=/etc/mtc-tls/certs/hybrid-server.crt"
      - "-key=/etc/mtc-tls/certs/hybrid-server.key"
      - "-bridge-url=http://mtc-bridge:8080"
      - "-addr=:4445"
      - "-refresh=30"
    depends_on:
      mtc-bridge:
        condition: service_healthy
    ports:
      - "4445:4445"
    volumes:
      - demo-certs:/etc/mtc-tls/certs:ro

volumes:
  postgres-data:
  softhsm-tokens:
  ejbca-p12:
  demo-certs:
  mtc-postgres-data:
  mtc-keys:
