#
# The PQC demo's web server (docker compose --profile demo), two sites over the certificates
# scripts/demo/pqc-seed.sh issues, both offering the ML-KEM hybrid key exchange first:
#   443  the hybrid chain: ECDSA signatures every client checks, ML-DSA alongside
#   444  the ML-DSA chain: post-quantum signatures throughout; OpenSSL 3.5 clients (curl) and
#        Brave 1.98.63 / Chromium 156 accept it once the root is trusted
# Each page reports what its own connection negotiated, so the demo shows it rather than claims it.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /demo/hybrid-web-fullchain.pem;
    ssl_certificate_key /demo/hybrid-web.key;
    ssl_protocols       TLSv1.3;
    # X25519MLKEM768 first (OpenSSL 3.5+, the hybrid post-quantum group browsers ship), then the
    # classical groups for clients that do not offer it.
    ssl_ecdh_curve      X25519MLKEM768:X25519:prime256v1;

    location = /tls {
        default_type text/plain;
        return 200 "protocol=$ssl_protocol cipher=$ssl_cipher group=$ssl_curve\n";
    }

    location / {
        default_type text/html;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><title>kimbo11ng PQC demo</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem}
code,b{font-family:ui-monospace,monospace}td{padding:.2rem .8rem .2rem 0;vertical-align:top}</style></head><body>
<h1>kimbo11ng PQC demo</h1>
<p>This page was served over a TLS connection whose details nginx reports here:</p>
<table>
<tr><td>Protocol</td><td><b>$ssl_protocol</b></td></tr>
<tr><td>Cipher</td><td><b>$ssl_cipher</b></td></tr>
<tr><td>Key exchange</td><td><b>$ssl_curve</b> &mdash; X25519MLKEM768 means the session keys are protected
against a future quantum computer (&ldquo;harvest now, decrypt later&rdquo;).</td></tr>
</table>
<h2>The certificate</h2>
<p>Issued by <i>PQC Demo Hybrid Sub CA</i> under <i>PQC Demo Hybrid Root CA</i>, both signing on a PKCS#11
HSM through kimbo11ng. Every certificate in the chain carries two signatures: ECDSA, which your browser
verified, and ML-DSA in the X.509 alternative-signature extensions, which browsers do not check yet.
<code>just demo-check</code> verifies the ML-DSA half.</p>
</body></html>';
    }
}

server {
    listen 444 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /demo/mldsa-web.pem;
    ssl_certificate_key /demo/mldsa-web.key;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519MLKEM768:X25519:prime256v1;

    location / {
        default_type text/plain;
        return 200 "kimbo11ng PQC demo, ML-DSA site\nprotocol=$ssl_protocol cipher=$ssl_cipher group=$ssl_curve\ncertificate: ML-DSA-65 key, signed ML-DSA-87 by PQC Demo ML-DSA Root CA on a PKCS#11 HSM\n";
    }
}
