worker_processes 1;

events {
    worker_connections 64;
}

http {
    # ─── Hybrid: RSA primary + ML-DSA-65 alternative signature ────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/hybrid-server.crt;
        ssl_certificate_key /etc/nginx/certs/hybrid-server.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1; # PQC + classical curves

        location / {
            default_type text/plain;
            return 200 'kimbo11ng PQC TLS Demo — HYBRID mode (port 4443)\n\nServer key:     RSA-2048 (TLS handshake — all clients)\nCA signature:   SHA256WithRSA (primary — verified by all clients)\n                ML-DSA-65 (alternative — X.509 v3 extension, verified by PQC-aware clients)\nIssued by:      Hybrid-RootCA\n\nThis is the migration-safe approach: legacy browsers verify the RSA signature,\nwhile PQC-aware clients (OpenSSL 3.6+) also verify the ML-DSA-65 alternative.\nBrowsers will show this as trusted (RSA chain validates normally).\n';
        }

        location /health {
            default_type text/plain;
            return 200 'ok\n';
        }
    }

    # ─── Pure PQC: ML-DSA-65 primary signature ───────────────────────────
    server {
        listen 4444 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/pqc-server.crt;
        ssl_certificate_key /etc/nginx/certs/pqc-server.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1; # PQC + classical curves

        location / {
            default_type text/plain;
            return 200 'kimbo11ng PQC TLS Demo — PURE PQC mode (port 4444)\n\nServer key:     RSA-2048 (TLS handshake)\nCA signature:   ML-DSA-65 (primary — FIPS 204)\nIssued by:      PQC-RootCA\n\nThe CA signature is pure post-quantum (ML-DSA-65). No RSA fallback.\nLegacy browsers will show "Not Secure" because they cannot verify ML-DSA-65.\nOnly PQC-aware TLS clients (OpenSSL 3.6+) can validate this certificate.\n\nNote: the server key is still RSA because no browser supports ML-DSA for\nTLS authentication yet. The PQC protection is in the CA trust chain.\n';
        }

        location /health {
            default_type text/plain;
            return 200 'ok\n';
        }
    }
}
